---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to re-publish (e.g. v3.1.0)
        type: string
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/avargaskun/exportarr

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # tags, releases, changelog commits
      pull-requests: write # release PRs and their labels
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: dev
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags pushed with GITHUB_TOKEN don't trigger workflows, so publishing is
  # chained here rather than in a tag-triggered workflow.
  version:
    name: Resolve version
    needs: release-please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Resolve version
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          elif [[ "$RELEASE_CREATED" == "true" ]]; then
            tag="$RELEASE_TAG"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$tag" =~ ^v(([0-9]+)\.([0-9]+)\.[0-9]+)$ ]]; then
            echo "::error::Not a release tag: $tag"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          major="${BASH_REMATCH[2]}"
          minor="$major.${BASH_REMATCH[3]}"

          # Floating tags only move forward, so re-publishing an older release
          # never repoints latest, X or X.Y at it.
          releases=$(
            { git ls-remote --tags --refs "$REPO_URL"; echo "refs/tags/$tag"; } |
              sed -n 's|.*refs/tags/v\([0-9]*\.[0-9]*\.[0-9]*\)$|\1|p' | sort -uV
          )
          highest() { awk -v prefix="$1" 'index($0, prefix) == 1' <<< "$releases" | tail -n 1; }
          tags="$IMAGE:$version"
          if [[ "$(highest "$minor.")" == "$version" ]]; then tags+=$'\n'"$IMAGE:$minor"; fi
          if [[ "$(highest "$major.")" == "$version" ]]; then tags+=$'\n'"$IMAGE:$major"; fi
          if [[ "$(highest "")" == "$version" ]]; then tags+=$'\n'"$IMAGE:latest"; fi
          echo "$tags"

          {
            echo "publish=true"
            echo "ref=refs/tags/$tag"
            echo "version=$version"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  tests:
    name: Tests
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yaml
    with:
      ref: ${{ needs.version.outputs.ref }}

  lint:
    name: Lint
    needs: version
    if: ${{ !cancelled() && needs.version.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yaml
    with:
      ref: ${{ needs.version.outputs.ref }}

  publish:
    name: Publish image
    needs: [version, tests, lint]
    if: >-
      ${{ !cancelled()
      && needs.version.outputs.publish == 'true'
      && needs.tests.result == 'success'
      && needs.lint.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.ref }}
          persist-credentials: false

      - name: Read commit metadata
        id: commit
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.33.0@sha256:6c2fa84a6b61ccd72899dde4239f8d5717f05f9a8ca6f3cad185fb1a95a94de3

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ steps.commit.outputs.revision }}
            BUILDTIME=${{ steps.commit.outputs.created }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.commit.outputs.revision }}
            org.opencontainers.image.created=${{ steps.commit.outputs.created }}
          tags: ${{ needs.version.outputs.tags }}
