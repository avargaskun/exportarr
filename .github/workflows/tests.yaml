---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Tests

on:
  pull_request:
    branches:
      - dev
  workflow_call:
    inputs:
      ref:
        description: Git ref to test (defaults to the triggering commit)
        type: string
        required: false
        default: ""
  workflow_dispatch:

# Called workflows inherit the caller's github.workflow, so the group needs a
# literal prefix or Tests and Lint would cancel each other inside Release.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Check go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run unit tests with coverage
        run: go test -race -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Check coverage floors
        run: go run ./internal/tools/covercheck -profile coverage.out -floors .github/coverage-floors.txt

  image:
    name: Container image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build image
        run: docker build --tag exportarr:ci .

      - name: Verify image
        run: |
          entrypoint=$(docker image inspect exportarr:ci --format '{{json .Config.Entrypoint}}')
          user=$(docker image inspect exportarr:ci --format '{{.Config.User}}')
          echo "entrypoint=$entrypoint user=$user"
          test "$entrypoint" = '["/exportarr"]'
          test "$user" = "65532:65532"
          id=$(docker create exportarr:ci)
          docker cp "$id:/exportarr" "$RUNNER_TEMP/exportarr"
          docker rm "$id"
          # Fails on a packed binary: UPX hides .go.buildinfo.
          go version -m "$RUNNER_TEMP/exportarr"
          docker run --rm exportarr:ci --help
