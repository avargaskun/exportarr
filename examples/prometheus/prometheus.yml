global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "sonarr-exporter"  # Renamed job_name for clarity
    static_configs:
      - targets: ["sonarr-exporter:9707"]  # Use service name and port

  - job_name: "radarr-exporter"  # Renamed job_name for clarity
    static_configs:
      - targets: ["radarr-exporter:9708"]  # Use service name and port

  - job_name: "prowlarr-exporter"  # Renamed job_name for clarity
    static_configs:
      - targets: ["prowlarr-exporter:9709"]  # Use service name and port

  - job_name: "sabnzbd-exporter"  # Renamed job_name for clarity
    static_configs:
      - targets: ["sabnzbd-exporter:9710"]  # Use service name and port

  - job_name: "lidarr-exporter"  # Renamed job_name for clarity
    static_configs:
      - targets: ["lidarr-exporter:9711"]  # Use service name and port

  # Serve mode (the commented exportarr-serve service in examples/compose):
  # one entry per target, selected by __metrics_path__ and named by instance.
  - job_name: "exportarr-serve"
    static_configs:
      - targets: ["exportarr-serve:9713"]
        labels:
          __metrics_path__: /metrics/sonarr-hd
          instance: sonarr-hd
      - targets: ["exportarr-serve:9713"]
        labels:
          __metrics_path__: /metrics/sonarr-4k
          instance: sonarr-4k
      - targets: ["exportarr-serve:9713"]
        labels:
          __metrics_path__: /metrics/prowlarr
          instance: prowlarr

  # The serve exporter's own metrics (runtime and upstream-limit metrics).
  - job_name: "exportarr-serve-self"
    static_configs:
      - targets: ["exportarr-serve:9713"]
