---
version: "3.7"
# To keep API keys out of this file, use Docker secrets: mount the secret and
# point API_KEY_FILE at it instead of setting API_KEY, e.g.
#
#   services:
#     radarr-exporter:
#       environment:
#         API_KEY_FILE: /run/secrets/radarr_api_key
#       secrets:
#         - radarr_api_key
#   secrets:
#     radarr_api_key:
#       file: ./radarr_api_key.txt

services:
  sonarr-exporter:
    image: ghcr.io/avargaskun/exportarr:3.2.0 # x-release-please-version
    container_name: sonarr-exporter
    command: ["sonarr"]
    environment:
      PORT: 9707
      URL: "http://x.x.x.x:8989" # or; http://sonarr:8989
      API_KEY: "xxx"
    #    networks:
    #    - your_custom_network # optional
    ports:
      - "9707:9707"
    restart: unless-stopped
  radarr-exporter:
    image: ghcr.io/avargaskun/exportarr:3.2.0 # x-release-please-version
    container_name: radarr-exporter
    command: ["radarr"]
    environment:
      PORT: 9708
      URL: "http://x.x.x.x:7878" # or; http://radarr:7878
      API_KEY: "xxx"
    #    networks:
    #    - your_custom_network # optional
    ports:
      - "9708:9708"
    restart: unless-stopped
  lidarr-exporter:
    image: ghcr.io/avargaskun/exportarr:3.2.0 # x-release-please-version
    container_name: lidarr-exporter
    command: ["lidarr"]
    environment:
      PORT: 9709
      URL: "http://x.x.x.x:8686" # or; http://lidarr:8686
      API_KEY: "xxx"
    #    networks:
    #     - your_custom_network # optional
    ports:
      - "9709:9709"
    restart: unless-stopped
  prowlarr-exporter:
    image: ghcr.io/avargaskun/exportarr:3.2.0 # x-release-please-version
    container_name: prowlarr-exporter
    command: ["prowlarr"]
    environment:
      PORT: 9710
      URL: "http://x.x.x.x:9696" # or; http://prowlarr:8080
      API_KEY: "abc"
      # PROWLARR__BACKFILL: true # optional
      # PROWLARR__BACKFILL_SINCE_DATE: "2023-03-01" # optional
    #    networks:
    #     - your_custom_network # optional
    ports:
      - "9710:9710"
    restart: unless-stopped
  sabnzbd-exporter:
    image: ghcr.io/avargaskun/exportarr:3.2.0 # x-release-please-version
    container_name: sabnzbd-exporter
    command: ["sabnzbd"]
    environment:
      PORT: 9711
      URL: "http://x.x.x.x:8080" # or; http://sabnzbd:8080
      API_KEY: "abc"
    #    networks:
    #     - your_custom_network # optional
    ports:
      - "9711:9711"
    restart: unless-stopped
  bazarr-exporter:
    image: ghcr.io/avargaskun/exportarr:3.2.0 # x-release-please-version
    container_name: bazarr-exporter
    command: ["bazarr"]
    environment:
      PORT: 9712
      URL: "http://x.x.x.x:6767" # or; http://bazarr:6767
      API_KEY: "xxx"
    #    networks:
    #     - your_custom_network # optional
    ports:
      - "9712:9712"
    restart: unless-stopped
  # Serve mode: one container exports several targets at /metrics/<name>
  # (see "Serving several targets from one process" in the README). Use it
  # instead of one service per app instance: uncomment it together with the
  # top-level secrets block below. The secret files must be readable by UID
  # 65532, the container user.
  # exportarr-serve:
  #   image: ghcr.io/avargaskun/exportarr:3.2.0 # x-release-please-version
  #   container_name: exportarr-serve
  #   command: ["serve"]
  #   environment:
  #     PORT: 9713
  #     TARGET_0_NAME: sonarr-hd
  #     TARGET_0_APP: sonarr
  #     TARGET_0_URL: "http://x.x.x.x:8989" # or; http://sonarr-hd:8989
  #     TARGET_0_API_KEY_FILE: /run/secrets/sonarr_hd_api_key
  #     TARGET_1_NAME: sonarr-4k
  #     TARGET_1_APP: sonarr
  #     TARGET_1_URL: "http://x.x.x.x:8990" # or; http://sonarr-4k:8989
  #     TARGET_1_API_KEY_FILE: /run/secrets/sonarr_4k_api_key
  #     TARGET_1_SERIES_CONCURRENCY: 4 # optional per-target override
  #     TARGET_2_NAME: prowlarr
  #     TARGET_2_APP: prowlarr
  #     TARGET_2_URL: "http://x.x.x.x:9696" # or; http://prowlarr:9696
  #     TARGET_2_API_KEY_FILE: /run/secrets/prowlarr_api_key
  #     # MAX_UPSTREAM_REQUESTS: 64 # optional; at least the number of targets + 1
  #   secrets:
  #     - sonarr_hd_api_key
  #     - sonarr_4k_api_key
  #     - prowlarr_api_key
  #   #    networks:
  #   #     - your_custom_network # optional
  #   ports:
  #     - "9713:9713"
  #   restart: unless-stopped

# secrets:
#   sonarr_hd_api_key:
#     file: ./sonarr_hd_api_key.txt
#   sonarr_4k_api_key:
#     file: ./sonarr_4k_api_key.txt
#   prowlarr_api_key:
#     file: ./prowlarr_api_key.txt
